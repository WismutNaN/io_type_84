[workspace]
members = ["crates/io-core", "crates/io-platform", "crates/io-cli", "src-tauri"]
default-members = ["crates/io-core", "crates/io-platform", "crates/io-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/WismutNaN/io_type_84"

[workspace.dependencies]
io-core = { path = "crates/io-core" }
io-platform = { path = "crates/io-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
